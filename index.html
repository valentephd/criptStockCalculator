<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Controle Cripto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

<div class="app" id="app">
    <!-- menu lateral injetado por js/shell.js -->

    <div class="app-main">
        <header class="app-header">
            <div class="header-left">
                <button id="btnMenuToggle" class="menu-toggle" aria-label="Abrir menu">☰</button>
            </div>
            <h1 class="app-title">Início</h1>
            <div class="header-right"></div>
        </header>

        <main class="content">
            <div class="card welcome">
                <h2>Bem-vindo ao Meu Controle Cripto 👋</h2>
                <p>Acompanhe suas operações de compra e venda, o preço médio, o valor de mercado e o lucro realizado de cada ativo.</p>
                <p>Use o <strong>menu</strong> (botão ☰) para abrir o <strong>Cadastro de Ativos</strong> e entrar no painel de cada um.</p>
            </div>
        </main>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>

</body>
</html>

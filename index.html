<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAVE Portfolio Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Painel de Controle AAVE</h2>

        <div class="form-group">
            <label>Cotação Atual (R$):</label>
            <input type="number" id="currentPriceInput" step="0.01" value="481.46">
            <button id="btnRefreshPrice" class="btn-secondary">Atualizar Preço</button>
            <span id="priceStatus" class="price-status">—</span>
        </div>

        <div class="grid-summary">
            <div class="summary-item">
                <div>Total Investido</div>
                <div class="summary-value" id="valTotalInvested">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div>Total de Moedas</div>
                <div class="summary-value" id="valTotalCoins">0.00 AAVE</div>
            </div>
            <div class="summary-item">
                <div>Preço Médio</div>
                <div class="summary-value" id="valAvgPrice">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div>Valor de Mercado</div>
                <div class="summary-value" id="valMarketValue">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div>Lucro Realizado</div>
                <div class="summary-value" id="valRealizedProfit">R$ 0,00</div>
            </div>
        </div>

        <div class="backup-bar">
            <button id="btnBackup" class="btn-secondary">Fazer Backup</button>
            <button id="btnRestore" class="btn-secondary">Restaurar Backup</button>
            <input type="file" id="restoreInput" accept=".json,application/json" style="display: none;">
        </div>
    </div>

    <div class="card">
        <h2>Nova Operação</h2>
        <div class="form-group">
            <select id="opType">
                <option value="buy">Compra</option>
                <option value="sell">Venda</option>
            </select>
            <input type="number" id="opBrl" placeholder="Valor (R$)" step="0.01">
            <input type="number" id="opAave" placeholder="Quantidade (AAVE)" step="0.00000001">
            <button id="btnAdd">Adicionar Operação</button>
        </div>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h2>Histórico de Operações</h2>
        <table id="txTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Operação</th>
                    <th>Qtd (AAVE)</th>
                    <th>Valor (R$)</th>
                    <th>Preço Unit. (R$)</th>
                    <th>Lucro Realizado</th>
                    <th>Potencial vs Atual</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows generated by JS -->
            </tbody>
        </table>
    </div>
</div>

<script src="js/portfolio.js"></script>
<script src="js/storage.js"></script>
<script src="js/price.js"></script>
<script src="js/app.js"></script>

</body>
</html>

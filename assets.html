<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Ativos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="assets">

<div class="app" id="app">
    <!-- menu lateral injetado por js/shell.js -->

    <div class="app-main">
        <header class="app-header">
            <div class="header-left">
                <button id="btnMenuToggle" class="menu-toggle" aria-label="Abrir menu">☰</button>
            </div>
            <h1 class="app-title">Lista de Ativos</h1>
            <div class="header-right"></div>
        </header>

        <div class="header-actions">
            <button id="btnOpenAssetModal">Adicionar Novo Ativo</button>
            <button id="toggleZeroed">Mostrar Posições Zeradas</button>
            <button id="toggleArchived">Mostrar Desativados</button>
        </div>

        <main class="content">
            <p id="assetsEmpty" style="display:none; color: var(--text-dim);">Nenhum ativo para exibir.</p>
            <!-- Uma seção (card + tabela) por tipo de ativo, gerada por JS. -->
            <div id="assetsContainer"></div>
        </main>
    </div>
</div>

<!-- Modal: Confirmação de desativação -->
<div id="archiveModal" class="modal-overlay">
    <div id="archiveBackdrop" class="modal-backdrop"></div>
    <div class="modal-box">
        <h2>Desativar Ativo</h2>
        <p>O ativo <strong id="archiveName"></strong> ficará <strong>desativado</strong> e sairá da lista principal, mas <strong>continuará nos dados</strong> — suas operações e histórico são preservados. Você pode reexibi-lo com o botão "Mostrar desativados".</p>
        <div class="modal-actions">
            <button id="btnArchiveCancel" class="btn-secondary">Cancelar</button>
            <button id="btnArchiveConfirm" class="btn-danger">Desativar</button>
        </div>
    </div>
</div>

<!-- Modal: Novo / Editar Ativo -->
<div id="assetModal" class="modal-overlay">
    <div id="assetModalBackdrop" class="modal-backdrop"></div>
    <div class="modal-box">
        <h2 id="assetModalTitle">Novo Ativo</h2>
        <div class="modal-form">
            <label>Nome</label>
            <input type="text" id="asName" placeholder="Ex.: Bitcoin">

            <label>Símbolo/Ticker</label>
            <input type="text" id="asSymbol" placeholder="Ex.: BTC">

            <label>ID de mercado (na API de preço)</label>
            <input type="text" id="asMarketId" placeholder="Ex.: bitcoin">

            <label>Tipo</label>
            <input type="text" id="asType" list="assetTypes" placeholder="Ex.: crypto" autocomplete="off">
            <datalist id="assetTypes"></datalist>

            <label>Casas decimais da quantidade</label>
            <input type="number" id="asDecimals" min="0" max="18" step="1" value="8">
        </div>
        <div class="modal-actions">
            <button id="btnAssetCancel" class="btn-secondary">Cancelar</button>
            <button id="btnAssetSave">Salvar</button>
        </div>
    </div>
</div>

<script src="js/format.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/storage.js"></script>
<script src="js/price.js"></script>
<script src="js/shell.js"></script>
<script>
    let showArchived = false;
    let showZeroed = false; // por padrão, oculta ativos com posição zerada
    let pendingArchiveId = null;
    let editingAssetId = null;

    // Rótulos amigáveis por tipo (para os títulos das listas). Fallback: o tipo.
    const TYPE_LABELS = { crypto: 'Criptomoedas', FII: 'FIIs' };

    // Preenche o datalist de tipos com os tipos já existentes (pick-or-create).
    function populateTypeOptions() {
        const types = [...new Set(loadAssets().map(a => a.type).filter(Boolean))];
        document.getElementById('assetTypes').innerHTML = types.map(t => `<option value="${t}"></option>`).join('');
    }

    // Abre o modal de ativo. Sem argumento = novo; com um asset = edição.
    function openAssetModal(asset) {
        populateTypeOptions();
        const title = document.getElementById('assetModalTitle');
        if (asset) {
            editingAssetId = asset.id;
            title.textContent = 'Editar Ativo';
            document.getElementById('asName').value = asset.name || '';
            document.getElementById('asSymbol').value = asset.symbol || '';
            document.getElementById('asMarketId').value = asset.marketId || '';
            document.getElementById('asType').value = asset.type || '';
            document.getElementById('asDecimals').value = (asset.quantityDecimals == null ? 8 : asset.quantityDecimals);
        } else {
            editingAssetId = null;
            title.textContent = 'Novo Ativo';
            document.getElementById('asName').value = '';
            document.getElementById('asSymbol').value = '';
            document.getElementById('asMarketId').value = '';
            document.getElementById('asType').value = 'crypto';
            document.getElementById('asDecimals').value = 8;
        }
        document.getElementById('assetModal').classList.add('open');
    }

    function closeAssetModal() {
        document.getElementById('assetModal').classList.remove('open');
        editingAssetId = null;
    }

    // Salva o ativo do modal: edição (mesmo id) ou novo (id via computeNextAssetId).
    function saveAsset() {
        const name = document.getElementById('asName').value.trim();
        const symbol = document.getElementById('asSymbol').value.trim();
        const marketId = document.getElementById('asMarketId').value.trim();
        const type = document.getElementById('asType').value.trim() || 'crypto';
        const decimals = parseInt(document.getElementById('asDecimals').value, 10);

        if (!name || !symbol || !marketId) {
            alert('Preencha Nome, Símbolo e ID de mercado.');
            return;
        }
        const quantityDecimals = (Number.isFinite(decimals) && decimals >= 0) ? decimals : 8;

        const assets = loadAssets();
        if (editingAssetId != null) {
            const a = assets.find(x => x.id === editingAssetId);
            if (a) {
                a.name = name;
                a.symbol = symbol;
                a.marketId = marketId;
                a.type = type;
                a.quantityDecimals = quantityDecimals;
            }
        } else {
            assets.push({
                id: computeNextAssetId(assets),
                type: type,
                marketId: marketId,
                symbol: symbol,
                name: name,
                quantityDecimals: quantityDecimals,
                isActive: true,
                createdAt: new Date().toISOString()
            });
        }
        saveAssets(assets);
        closeAssetModal();
        renderAssets();
    }

    // Todas as operações (uma vez). A posição por ativo reusa o MESMO motor
    // (processPortfolio) do painel: alimenta o global `transactions` e a cotação
    // (input oculto injetado pelo shell) com o último preço conhecido do ativo.
    const allTransactions = loadTransactions();

    function computePosition(asset) {
        // Alimenta o motor SÓ com buy/sell (proventos são tratados à parte).
        window.transactions = allTransactions.filter(t =>
            t.assetId === asset.id && (t.type === 'buy' || t.type === 'sell'));
        const last = loadLastPrice(asset.id);
        document.getElementById('currentPriceInput').value = last ? String(last.price) : '0';
        const d = processPortfolio();
        const proventos = allTransactions.reduce((s, t) =>
            (t.assetId === asset.id && t.type === 'income' ? s + t.brl : s), 0);
        // Preço médio ajustado (com proventos), travado em zero.
        const adjustedAvg = d.totalCoins > 0
            ? Math.max(0, (d.totalInvested - proventos) / d.totalCoins) : 0;
        const saldoTotal = d.totalRealizedProfit + proventos - d.totalInvested;
        // Resultado Potencial = saldo que você teria se liquidasse TUDO agora ao
        // lastPrice. Parte do saldo já realizado (vendas + proventos) e soma o
        // valor de mercado da posição restante (d.marketValue = qtd × lastPrice).
        // Sem cotação para valorar a posição restante -> null ("—").
        const lastPrice = last ? last.price : 0;
        const potential = (d.totalCoins > 0 && lastPrice <= 0)
            ? null
            : (saldoTotal + d.marketValue);
        return {
            totalCoins: d.totalCoins,
            avgPrice: d.avgPrice,
            adjustedAvg: adjustedAvg,
            totalInvested: d.totalInvested,
            proventos: proventos,
            potential: potential,
            saldo: d.totalRealizedProfit - d.totalInvested,
            saldoTotal: saldoTotal
        };
    }

    // Monta as células de ação (abrir/editar/desativar-reativar) de uma linha.
    function actionCells(a) {
        const archived = a.isActive === false;
        const open = `<a class="btn-icon" href="asset.html?id=${a.id}" title="Abrir ativo">👁</a>`;
        const edit = `<button class="btn-icon" data-edit="${a.id}" title="Editar ativo">✏️</button>`;
        const action = archived
            ? `<button class="btn-icon" data-reactivate="${a.id}" title="Reativar ativo">♻</button>`
            : `<button class="btn-icon danger" data-archive="${a.id}" title="Desativar ativo">🗑</button>`;
        return open + edit + action;
    }

    // Renderiza uma linha de ativo. FII tem colunas próprias (preço médio
    // ajustado, proventos e saldo total realizado).
    function renderAssetRow(a, pos, idx, isFiiType) {
        const archived = a.isActive === false;
        const decimals = (typeof a.quantityDecimals === 'number' ? a.quantityDecimals : 8);
        const arch = archived ? ' <span class="badge-archived">desativado</span>' : '';
        const typeCls = a.type === 'FII' ? 'badge-type badge-type--fii' : 'badge-type';
        const nameCell = `${a.name} <span class="${typeCls}">${a.type}</span>${arch}`;
        const rowCls = archived ? 'row-archived' : '';
        // Célula de Resultado Potencial (null quando não há cotação/posição -> "—").
        const potHtml = pos.potential === null
            ? '<td>—</td>'
            : `<td class="${pos.potential >= 0 ? 'positive' : 'negative'}">${formatCurrency(pos.potential)}</td>`;

        if (isFiiType) {
            const saldoCls = pos.saldo >= 0 ? 'positive' : 'negative';
            // Payback: % que os proventos representam do Total Investido (mesma
            // conta do "Payback de Proventos" em asset.html).
            const provPct = pos.totalInvested > 0
                ? ` <span class="pct">(${formatPct(pos.proventos / pos.totalInvested)})</span>`
                : '';
            return `
                <tr class="${rowCls}">
                    <td>${idx + 1}</td>
                    <td>${nameCell}</td>
                    <td>${a.symbol}</td>
                    <td>${formatAmount(pos.totalCoins, decimals)}</td>
                    <td>${formatUnitPrice(pos.avgPrice)}</td>
                    <td>${formatCurrency(pos.totalInvested)}</td>
                    <td class="positive">${formatCurrency(pos.proventos)}${provPct}</td>
                    <td class="${saldoCls}">${formatCurrency(pos.saldo)}</td>
                    ${potHtml}
                    <td>${actionCells(a)}</td>
                </tr>`;
        }
        const saldoCls = pos.saldo >= 0 ? 'positive' : 'negative';
        return `
            <tr class="${rowCls}">
                <td>${idx + 1}</td>
                <td>${nameCell}</td>
                <td>${a.symbol}</td>
                <td>${formatAmount(pos.totalCoins, decimals)}</td>
                <td>${formatCurrency(pos.avgPrice)}</td>
                <td>${formatCurrency(pos.totalInvested)}</td>
                <td class="${saldoCls}">${formatCurrency(pos.saldo)}</td>
                ${potHtml}
                <td>${actionCells(a)}</td>
            </tr>`;
    }

    // Somatório exibido no título da seção (valores SEPARADOS por " + ", nunca
    // somados). Cripto: Investido + Saldo Total; FII: Investido + Proventos;
    // outros: Investido + Proventos + Saldo Realizado.
    function sectionSummary(type, items, grandInvested) {
        let inv = 0, prov = 0, saldo = 0, potential = 0;
        items.forEach(x => {
            inv += x.pos.totalInvested;
            prov += x.pos.proventos;
            saldo += x.pos.saldo;
            potential += (x.pos.potential || 0);
        });
        // colored=false no Total Investido (é só o montante, sem sinal); nos
        // demais, verde/vermelho conforme o valor. `extra` = sufixo discreto
        // (usado pela % do Total Investido em relação ao total geral).
        const part = (label, val, colored, extra) => {
            const cls = colored ? (val >= 0 ? ' positive' : ' negative') : '';
            const ex = extra ? ` <span class="pct">(${extra})</span>` : '';
            return `<span class="sec-sum-part${cls}"><span class="sec-sum-label">${label}</span><span class="sec-sum-value">${formatCurrency(val)}${ex}</span></span>`;
        };
        // % que o investido deste tipo representa do total investido (entre tipos).
        const invPct = grandInvested > 0 ? formatPct(inv / grandInvested) : null;
        const invPart = part('Total Investido', inv, false, invPct);
        let base;
        if (type === 'FII') {
            base = [invPart, part('Dividendos Recebidos', prov, true)];
        } else if (type === 'crypto') {
            base = [invPart, part('Saldo Realizado', saldo, true)];
        } else {
            base = [invPart, part('Dividendos Recebidos', prov, true), part('Saldo Realizado', saldo, true)];
        }
        base.push(part('Resultado Potencial', potential, true));
        // Cada totalizador é um "card" independente (valores nunca somados).
        return base.join('');
    }

    // Monta a seção (card + tabela) de um tipo, com colunas próprias de FII.
    // Cabeçalho clicável = sanfona (expande/retrai a tabela).
    function renderTypeSection(type, items, grandInvested) {
        const isFiiType = type === 'FII';
        const title = TYPE_LABELS[type] || type;
        const head = isFiiType
            ? `<tr><th>#</th><th>Nome</th><th>Símbolo</th><th>Quantidade</th><th>Preço Médio Atual</th><th>Total Investido</th><th>Dividendos Recebidos</th><th>Saldo Realizado</th><th>Resultado Potencial</th><th>Ações</th></tr>`
            : `<tr><th>#</th><th>Nome</th><th>Símbolo</th><th>Quantidade</th><th>Preço Médio Atual</th><th>Total Investido</th><th>Saldo Realizado</th><th>Resultado Potencial</th><th>Ações</th></tr>`;
        const body = items.map((x, idx) => renderAssetRow(x.a, x.pos, idx, isFiiType)).join('');
        // Estado recolhido/expandido persistido por tipo (systemConfigs).
        const collapsed = getConfig('collapsedAssetTypes', []).indexOf(type) !== -1;
        return `
            <div class="card asset-section${collapsed ? ' collapsed' : ''}" data-type="${type}">
                <div class="section-header" data-toggle-section>
                    <span class="section-caret">▾</span>
                    <h2>${title}</h2>
                    <span class="section-summary">${sectionSummary(type, items, grandInvested)}</span>
                    <span class="section-count">${items.length}</span>
                </div>
                <div class="section-body table-wrap">
                    <table><thead>${head}</thead><tbody>${body}</tbody></table>
                </div>
            </div>`;
    }

    function renderAssets() {
        const all = loadAssets();
        const container = document.getElementById('assetsContainer');
        const empty = document.getElementById('assetsEmpty');

        // Filtro 1: desativados. Filtro 2 (tempo real): posição zerada.
        const base = showArchived ? all : all.filter(a => a.isActive === true);
        const withPos = base.map(a => ({ a, pos: computePosition(a) }));
        const visible = showZeroed ? withPos : withPos.filter(x => x.pos.totalCoins > 0);

        if (!visible.length) {
            container.innerHTML = '';
            empty.style.display = '';
            return;
        }
        empty.style.display = 'none';

        // Agrupa por tipo, preservando a ordem de aparição dos tipos.
        const types = [];
        const byType = {};
        visible.forEach(x => {
            const t = x.a.type || '—';
            if (!byType[t]) { byType[t] = []; types.push(t); }
            byType[t].push(x);
        });

        // Total investido somando TODOS os tipos (base da % do "Total Investido").
        const grandInvested = visible.reduce((s, x) => s + x.pos.totalInvested, 0);
        container.innerHTML = types.map(t => renderTypeSection(t, byType[t], grandInvested)).join('');
    }

    window.addEventListener('load', () => {
        // Estado inicial dos filtros vem do systemConfigs (persistido).
        showArchived = getConfig('showArchivedAssets', false);
        showZeroed = getConfig('showZeroedAssets', false);

        const toggleBtn = document.getElementById('toggleArchived');
        const toggleZeroBtn = document.getElementById('toggleZeroed');

        // Reflete o estado (on/off) no texto e no destaque do botão.
        function syncToggle(btn, on, showLabel, hideLabel) {
            btn.textContent = on ? hideLabel : showLabel;
            btn.classList.toggle('active', on);
        }
        syncToggle(toggleBtn, showArchived, 'Mostrar Desativados', 'Ocultar Desativados');
        syncToggle(toggleZeroBtn, showZeroed, 'Mostrar Posições Zeradas', 'Ocultar Posições Zeradas');

        renderAssets();

        // Toggle: mostrar/ocultar desativados (persiste no systemConfigs)
        toggleBtn.addEventListener('click', () => {
            showArchived = !showArchived;
            setConfig('showArchivedAssets', showArchived);
            syncToggle(toggleBtn, showArchived, 'Mostrar Desativados', 'Ocultar Desativados');
            renderAssets();
        });

        // Toggle: mostrar/ocultar posições zeradas (persiste no systemConfigs)
        toggleZeroBtn.addEventListener('click', () => {
            showZeroed = !showZeroed;
            setConfig('showZeroedAssets', showZeroed);
            syncToggle(toggleZeroBtn, showZeroed, 'Mostrar Posições Zeradas', 'Ocultar Posições Zeradas');
            renderAssets();
        });

        // Botão "Adicionar Novo Ativo" + fiação do modal de ativo
        document.getElementById('btnOpenAssetModal').addEventListener('click', () => openAssetModal());
        document.getElementById('btnAssetSave').addEventListener('click', saveAsset);
        document.getElementById('btnAssetCancel').addEventListener('click', closeAssetModal);
        document.getElementById('assetModalBackdrop').addEventListener('click', closeAssetModal);

        // Ações das tabelas (delegado no container): sanfona, editar, reativar ou desativar
        document.getElementById('assetsContainer').addEventListener('click', (e) => {
            // Sanfona: clique no cabeçalho expande/retrai a lista e persiste o
            // estado por tipo no systemConfigs.
            const secHeader = e.target.closest('[data-toggle-section]');
            if (secHeader) {
                const card = secHeader.closest('.asset-section');
                const collapsed = card.classList.toggle('collapsed');
                const type = card.getAttribute('data-type');
                const set = getConfig('collapsedAssetTypes', []);
                const i = set.indexOf(type);
                if (collapsed && i === -1) set.push(type);
                else if (!collapsed && i !== -1) set.splice(i, 1);
                setConfig('collapsedAssetTypes', set);
                return;
            }

            const editBtn = e.target.closest('button[data-edit]');
            if (editBtn) {
                const asset = getAssetById(Number(editBtn.getAttribute('data-edit')));
                if (asset) openAssetModal(asset);
                return;
            }

            const reBtn = e.target.closest('button[data-reactivate]');
            if (reBtn) {
                const id = Number(reBtn.getAttribute('data-reactivate'));
                const assets = loadAssets();
                const a = assets.find(x => x.id === id);
                if (a) {
                    a.isActive = true;
                    saveAssets(assets);
                }
                renderAssets();
                return;
            }

            const btn = e.target.closest('button[data-archive]');
            if (!btn) return;
            const id = Number(btn.getAttribute('data-archive'));
            const asset = getAssetById(id);
            if (!asset) return;
            pendingArchiveId = id;
            document.getElementById('archiveName').textContent = asset.symbol + ' (id ' + id + ')';
            document.getElementById('archiveModal').classList.add('open');
        });

        // Modal de confirmação
        const modal = document.getElementById('archiveModal');
        const closeModal = () => { modal.classList.remove('open'); pendingArchiveId = null; };
        document.getElementById('btnArchiveCancel').addEventListener('click', closeModal);
        document.getElementById('archiveBackdrop').addEventListener('click', closeModal);
        document.getElementById('btnArchiveConfirm').addEventListener('click', () => {
            if (pendingArchiveId != null) {
                const assets = loadAssets();
                const a = assets.find(x => x.id === pendingArchiveId);
                if (a) {
                    a.isActive = false;
                    saveAssets(assets);
                }
            }
            closeModal();
            renderAssets();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeModal(); closeAssetModal(); }
        });
    });
</script>

</body>
</html>

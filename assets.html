<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Ativos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="assets">

<div class="app" id="app">
    <!-- menu lateral injetado por js/shell.js -->

    <div class="app-main">
        <header class="app-header">
            <div class="header-left">
                <button id="btnMenuToggle" class="menu-toggle" aria-label="Abrir menu">☰</button>
            </div>
            <h1 class="app-title">Cadastro de Ativos</h1>
            <div class="header-right"></div>
        </header>

        <main class="content">
            <div class="card">
                <h2>Ativos Cadastrados</h2>
                <p id="assetsEmpty" style="display:none; color: var(--text-dim);">Nenhum ativo cadastrado.</p>
                <div class="table-wrap">
                <table id="assetsTable">
                    <thead>
                        <tr>
                            <th>Símbolo</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>ID de mercado</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows generated by JS -->
                    </tbody>
                </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/storage.js"></script>
<script src="js/shell.js"></script>
<script>
    window.addEventListener('load', () => {
        const assets = loadAssets().filter(a => a.isActive !== false);
        const tbody = document.querySelector('#assetsTable tbody');
        const empty = document.getElementById('assetsEmpty');
        if (!assets.length) {
            empty.style.display = '';
            return;
        }
        tbody.innerHTML = assets.map(a => `
            <tr>
                <td>${a.symbol}</td>
                <td>${a.name}</td>
                <td>${a.type}</td>
                <td>${a.marketId}</td>
                <td><a class="btn-link" href="asset.html?id=${a.id}">Abrir</a></td>
            </tr>
        `).join('');
    });
</script>

</body>
</html>
